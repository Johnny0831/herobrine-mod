plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.0.0'
group = 'com.hollowvigil'
base { archivesName = 'hollowvigil-1.20.1' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// Ignora restos da versão antiga (mod "herobrine") caso ainda existam no repositório.
sourceSets {
    main {
        java { exclude 'com/herobrinemod/**' }
        resources { exclude 'assets/herobrine/**' }
    }
}

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { hollowvigil { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            args '--nogui'
            mods { hollowvigil { source sourceSets.main } }
        }
    }
}

repositories { }

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.2.0'
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
